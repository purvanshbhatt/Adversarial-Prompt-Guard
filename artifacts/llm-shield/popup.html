<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>LLM Shield</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117;
      color: #e6edf3;
      width: 300px;
      min-height: 200px;
    }
    .header {
      display: flex; align-items: center; gap: 10px;
      padding: 16px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #7c3aed, #2563eb);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }
    .header-text h2 { font-size: 15px; font-weight: 700; }
    .header-text p  { font-size: 11px; color: #8b949e; margin-top: 1px; }

    .status-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .status-label { font-size: 13px; color: #8b949e; }
    .status-pill {
      font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
      padding: 3px 10px; border-radius: 20px;
    }
    .status-pill.on  { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .status-pill.off { background: rgba(239,68,68,0.15); color: #f87171; border: 1px solid rgba(239,68,68,0.3); }

    .stat-grid {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 1px;
      background: rgba(255,255,255,0.06);
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .stat-cell {
      background: #0d1117;
      padding: 14px 16px;
    }
    .stat-num { font-size: 22px; font-weight: 700; color: #e6edf3; }
    .stat-num.warn { color: #f87171; }
    .stat-desc { font-size: 11px; color: #8b949e; margin-top: 2px; }

    .footer {
      padding: 12px 16px;
      display: flex; gap: 8px;
    }
    .btn-settings {
      flex: 1; padding: 9px 12px;
      font-size: 12px; font-weight: 500;
      background: rgba(255,255,255,0.05);
      color: #8b949e;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 8px; cursor: pointer;
      transition: all 0.15s;
    }
    .btn-settings:hover { background: rgba(255,255,255,0.09); color: #e6edf3; }

    .btn-toggle {
      flex: 1; padding: 9px 12px;
      font-size: 12px; font-weight: 600;
      background: #7c3aed; color: white;
      border: none; border-radius: 8px; cursor: pointer;
      transition: background 0.15s;
    }
    .btn-toggle:hover { background: #6d28d9; }
    .btn-toggle.off { background: rgba(34,197,94,0.15); color: #4ade80; border: 1px solid rgba(34,197,94,0.3); }
    .btn-toggle.off:hover { background: rgba(34,197,94,0.25); }

    .site-guard {
      padding: 4px 16px 14px;
      font-size: 11px; color: #8b949e;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">🛡️</div>
    <div class="header-text">
      <h2>LLM Shield</h2>
      <p>Prompt injection defense</p>
    </div>
  </div>

  <div class="status-row">
    <span class="status-label">Protection status</span>
    <span class="status-pill" id="statusPill">—</span>
  </div>

  <div class="stat-grid">
    <div class="stat-cell">
      <div class="stat-num" id="statScanned">—</div>
      <div class="stat-desc">Prompts scanned</div>
    </div>
    <div class="stat-cell">
      <div class="stat-num warn" id="statBlocked">—</div>
      <div class="stat-desc">Threats detected</div>
    </div>
    <div class="stat-cell">
      <div class="stat-num" id="statThreshold">—</div>
      <div class="stat-desc">Risk threshold</div>
    </div>
    <div class="stat-cell">
      <div class="stat-num" id="statEndpoint">API</div>
      <div class="stat-desc" id="statEndpointLabel">Not configured</div>
    </div>
  </div>

  <div class="footer">
    <button class="btn-settings" id="btnSettings">⚙ Settings</button>
    <button class="btn-toggle" id="btnToggle">Disable</button>
  </div>

  <div class="site-guard">Guarding: ChatGPT · Claude · Gemini</div>

  <script src="popup.js"></script>
</body>
</html>
